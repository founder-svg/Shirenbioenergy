<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pelletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C56B"/>
      <stop offset="30%" stop-color="#C49A3C"/>
      <stop offset="70%" stop-color="#8C6321"/>
      <stop offset="100%" stop-color="#54390F"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5DC96"/>
      <stop offset="50%" stop-color="#D4A747"/>
      <stop offset="100%" stop-color="#9E7422"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Main Cylindrical Biomass Pellet -->
    <rect x="18" y="12" width="28" height="38" rx="14" fill="url(#pelletGrad)" stroke="#382407" stroke-width="1.2"/>
    <!-- Compressed Wood Grain Fiber Ridges -->
    <line x1="22" y1="18" x2="42" y2="18" stroke="#FFF" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
    <line x1="20" y1="26" x2="44" y2="26" stroke="#2B1A04" stroke-width="1.4" stroke-opacity="0.7" stroke-linecap="round"/>
    <line x1="22" y1="34" x2="42" y2="34" stroke="#FFF" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
    <line x1="24" y1="41" x2="40" y2="41" stroke="#2B1A04" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round"/>
    <!-- Top Burnished Rim / Highlight -->
    <ellipse cx="32" cy="14" rx="12" ry="4" fill="url(#capGrad)"/>
  </g>
</svg>
